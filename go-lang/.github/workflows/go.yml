name: Go

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Learn about Go
      run: |
        go version
        go list -m all
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v4
    - name: Run tests
      run: go test -v ./...
    - name: Run linter
      run: golangci-lint run -v
